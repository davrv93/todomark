server {
  listen 80;

  location / {
    # ClickHouse también agrega sus propios headers CORS (Tabix manda
    # add_http_cors_header=1) — si dejamos los suyos Y ponemos los nuestros,
    # el header queda duplicado ("*, *, *") y el navegador lo rechaza por inválido.
    # Los borramos acá y ponemos UNA sola copia limpia.
    proxy_hide_header 'Access-Control-Allow-Origin';
    proxy_hide_header 'Access-Control-Allow-Methods';
    proxy_hide_header 'Access-Control-Allow-Headers';

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'origin, x-requested-with, content-type, authorization, x-clickhouse-user, x-clickhouse-key' always;

    if ($request_method = OPTIONS) {
      return 204;
    }

    proxy_pass http://clickhouse:8123;
    proxy_set_header Host $host;
  }
}
