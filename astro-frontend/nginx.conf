server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Sin esto, un directory-redirect (ej. /landing -> /landing/) sale como
  # absoluto con el host interno (puerto 80), no con el puerto mapeado del host.
  absolute_redirect off;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
