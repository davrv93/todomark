services:
  todamark-web:
    build:
      context: ./web
      args:
        - VITE_API_URL=http://localhost:8081
    ports:
      - "8080:80"
    depends_on:
      - todomark-api
    restart: unless-stopped

  todomark-api:
    build: ./api-go
    ports:
      - "8081:3000"
    environment:
      - EVOLUTION_URL=http://evolution:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-todomark}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://todomark-api:3000}
    volumes:
      - sqlite_data:/data
    depends_on:
      - evolution
    restart: unless-stopped

  evolution:
    image: evoapicloud/evolution-api:latest
    ports:
      - "3100:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://todomark:todomark@postgres:5432/todomark
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - evolution_instances:/evolution/instances

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=todomark
      - POSTGRES_PASSWORD=todomark
      - POSTGRES_DB=todomark
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  sqlite_data:
  postgres_data:
  evolution_instances:
